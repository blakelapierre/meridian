<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meridian check</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #eee; }
      body { display: flex; }
      main { height: 100vh; width: min(72vw, calc(100vh * 16 / 9)); background: #111; }
      aside { flex: 1; min-width: 240px; display: flex; flex-direction: column; }
      iframe { width: 100%; border: 0; background: #000; }
      main iframe { height: 100%; }
      aside iframe { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <main><iframe id="primary" title="primary"></iframe></main>
    <aside>
      <iframe id="second" title="second client"></iframe>
      <iframe id="follow" title="follow"></iframe>
    </aside>
    <script>
      const params = new URLSearchParams(location.search);
      for (const id of ["primary", "second", "follow"]) {
        const frame = document.querySelector("#" + id);
        const src = params.get(id);
        if (src) frame.src = src;
      }
    </script>
  </body>
</html>
